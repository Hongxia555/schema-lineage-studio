          <span class="ftype">${esc(f.type)}${f.notNull ? '<span class="nn-badge">NN</span>' : ''}</span>
        </div>`;
      });
      const hiddenCols = n.table.fields.filter(f => !shown.includes(f));
      if(hiddenCols.length){
        html += `<div class="row dim hidden-fields" title="${esc('hidden: ' + hiddenCols.map(f => f.name).join(', '))}"><span class="fname">+${hiddenCols.length} hidden field${hiddenCols.length > 1 ? 's' : ''}</span></div>`;
      }
      div.innerHTML = html;
    } else if(n.kind === 'sticky'){
      const bg = !n.sticky.color || n.sticky.color === 'none' ? 'var(--panel)' : n.sticky.color;
      div.className = 'node sticky-node';
      div.style.background = bg;
      if(bg === 'var(--panel)') div.style.color = 'var(--text)';
      div.innerHTML = `<div class="sticky-name">${esc(n.sticky.name)}</div><div class="sticky-text">${esc(n.sticky.text || '')}</div>`;
    } else {
      let html = `<div class="head" style="background:${color}">
        <span>▸ ${n.group} <span style="opacity:.75;font-weight:500">(${n.members.length} tables)</span></span>
        <button class="expand-btn" data-group="${n.group}" title="expand this group back out">expand ⤢</button>
      </div>`;
      n.members.slice(0,7).forEach(mName => {
        html += `<div class="row dim" style="cursor:default"><span class="fname">${mName}</span></div>`;
      });
      if(n.members.length > 7) html += `<div class="row dim" style="cursor:default"><span class="fname">+${n.members.length-7} more…</span></div>`;
      div.innerHTML = html;
    }

    nodesEl.appendChild(div);
    makeDraggable(div, id);
  });

  renderGroupBoxes();

  viewport.style.width = (maxX+60+GROUP_PAD)+'px';
  viewport.style.height = (maxY+60+GROUP_PAD)+'px';
  edgesSvg.setAttribute('width', maxX+60+GROUP_PAD);
  edgesSvg.setAttribute('height', maxY+60+GROUP_PAD);

  drawEdges();
  bindRowClicks();
  bindHoverCards();
  bindExpandButtons();
  renderLegend();
  renderTree();
}

function drawEdges(){
  const refShow = mode === 'both' || mode === 'ref';
  const depShow = mode === 'both' || mode === 'dep';
  let svg = '';
  // one arrowhead marker per distinct line color
  const arrowIds = new Map();
  function arrowFor(color){
    if(!arrowIds.has(color)) arrowIds.set(color, 'arrow-' + arrowIds.size);
    return arrowIds.get(color);
  }

  // Several Ref lines often land on the same column (a PK referenced by many FKs).
  // Fan them out within the row so markers and 1 / 0..1 / * labels don't pile up.
  const portTotal = new Map(), portNext = new Map();
  const portKey = (id, f) => id + '|' + f;
  if(refShow) currentDisplay.edges.forEach(e => {
    if(e.kind !== 'ref') return;
    [portKey(e.fromId, e.fromField), portKey(e.toId, e.toField)].forEach(k => portTotal.set(k, (portTotal.get(k) || 0) + 1));
  });
  function takeSlot(id, f){
    const k = portKey(id, f), n = portTotal.get(k) || 1, i = portNext.get(k) || 0;
    portNext.set(k, i + 1);
    const gap = Math.min(12, 20 / Math.max(n - 1, 1));
    const dy = n > 1 ? (i - (n - 1) / 2) * gap : 0;
    return { dy, below: n > 1 && dy > 0 };
  }

  hoverBlocks = [];
  const depPairs = new Map();
  currentDisplay.edges.forEach(e => {
    if(e.kind === 'ref' && !refShow) return;
    if(e.kind === 'dep' && !depShow) return;
    const hit = traceState && e.kind === 'dep' && traceState.edgeSet.has(e.orig);
    const dim = traceState && !hit;
    const color = edgeColor(e);

    if(e.kind === 'ref'){
      const s1 = takeSlot(e.fromId, e.fromField), s2 = takeSlot(e.toId, e.toField);
      const r = refPath(e.fromId, e.fromField, e.toId, e.toField, s1.dy, s2.dy);
      if(!r) return;
      // [inactive]: documented but not enforced — drawn faint and dotted
      const inactive = e.orig.inactive;
      svg += `<path d="${r.path}" fill="none" stroke="${color}" stroke-width="1.6"${inactive ? ' stroke-dasharray="2,4"' : ''} opacity="${dim ? 0.12 : inactive ? 0.45 : 1}"/>`;
      r.joints.forEach(([jx,jy]) => {
        svg += `<circle cx="${jx}" cy="${jy}" r="2.5" fill="${color}" opacity="${dim?0.12:1}"/>`;
      });
      // cardinality only means something at a real table edge, not a collapsed group card
      if(e.fromField && e.orig.fromCard) svg += cardinalityMarkerSvg(r.start, e.orig.fromCard, e.orig.fromOpt, dim, color, s1.below);
      if(e.toField && e.orig.toCard) svg += cardinalityMarkerSvg(r.end, e.orig.toCard, e.orig.toOpt, dim, color, s2.below);
      // path is drawn from -> to; flip the flow when "from" is the many side so dots always run one -> many
      const reverse = e.orig.fromCard === 'many' && e.orig.toCard === 'one' ? '1' : '0';
      svg += `<path class="ref-hit" data-reverse="${reverse}" data-color="${color}" d="${r.path}" fill="none" stroke="transparent" stroke-width="14" style="pointer-events:stroke;cursor:pointer"/>`;
    } else {
      // Lineage is shown at TABLE level by default: collect every column mapping
      // per source-table -> target-table pair and draw one header-to-header line
      // below. Column-level lines only appear on column hover, or for a traced path.
      if(hit){
        const d = edgePath(e.fromId, e.fromField, e.toId, e.toField);
        if(d) svg += `<path d="${d}" fill="none" stroke="var(--edge-dep-glow)" stroke-width="2.8" marker-end="url(#${arrowFor('var(--edge-dep-glow)')})"/>`;
      }
      const k = e.fromId + '→' + e.toId;
      if(!depPairs.has(k)) depPairs.set(k, []);
      depPairs.get(k).push(e);
    }
  });

  depPairs.forEach(list => {
    const e0 = list[0];
    const d = edgePath(e0.fromId, null, e0.toId, null);
    if(!d) return;
    const color = edgeColor(e0);
    const dim = !!traceState; // while tracing, table-level lines recede behind the traced column path
    svg += `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#${arrowFor(color)})" opacity="${dim?0.15:1}"/>`;
    // invisible fat hit-path: hovering the table line opens a card with every
    // column mapping between these two tables (plus note / SQL)
    const blockIdx = hoverBlocks.length;
    hoverBlocks.push(pairBlock(list));
    svg += `<path class="dep-hit" data-block-idx="${blockIdx}" data-color="${color}" data-pair="${esc(e0.fromId)}>${esc(e0.toId)}" d="${d}" fill="none" stroke="transparent" stroke-width="16" style="pointer-events:stroke;cursor:help"/>`;
  });

  let defs = '<defs>';
  arrowIds.forEach((id, color) => {
    defs += `<marker id="${id}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${color}"/></marker>`;
  });
  svg = defs + '</defs>' + svg;

  edgesSvg.innerHTML = svg;
  flowOverlays = [];
  edgesSvg.querySelectorAll('.dep-hit').forEach(el => {
    const block = hoverBlocks[+el.dataset.blockIdx];
    el.addEventListener('mouseenter', (ev) => { showEdgeFlow(el, 'dep'); showDepTooltip(block, ev); });
    el.addEventListener('mousemove', (ev) => positionDepTooltip(ev));
    el.addEventListener('mouseleave', () => { hideEdgeFlow(); hideDepTooltipSoon(); });
  });
  edgesSvg.querySelectorAll('.ref-hit').forEach(el => {
    el.addEventListener('mouseenter', () => showEdgeFlow(el, 'ref'));
    el.addEventListener('mouseleave', hideEdgeFlow);
  });
  renderFlowAll();

  document.querySelectorAll('.node').forEach(n => {
    const id = n.dataset.id;
    if(!traceState){ n.classList.remove('dim','trace-hit'); }
    else if(traceState.displayIdSet.has(id)){ n.classList.remove('dim'); n.classList.add('trace-hit'); }
    else { n.classList.add('dim'); n.classList.remove('trace-hit'); }
  });
  document.querySelectorAll('.row[data-field]').forEach(r => {
    const key = r.dataset.table+'.'+r.dataset.field;
    if(!traceState){ r.classList.remove('trace-hit'); return; }
    if(traceState.fieldSet.has(key)) r.classList.add('trace-hit'); else r.classList.remove('trace-hit');
  });
}

// ---------- Hover highlight: a thicker overlay with dots flowing along the line ----------
// Dep: dashes flow source -> target. Ref: dots flow one -> many.
function makeFlowEl(hitEl, kind, glow){
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  el.setAttribute('d', hitEl.getAttribute('d'));
  let cls = 'edge-flow ' + (kind === 'ref' ? 'ref-flow' : 'dep-flow');
  if(hitEl.dataset.reverse === '1') cls += ' flow-reverse';
  if(!glow) cls += ' flow-all';
  el.setAttribute('class', cls);
  const c = hitEl.dataset.color;
  if(c){ el.style.stroke = c; if(glow) el.style.filter = `drop-shadow(0 0 3px ${c})`; }
  return el;
}
function showEdgeFlow(hitEl, kind, keepOthers){
  if(!keepOthers) hideEdgeFlow();
  const el = makeFlowEl(hitEl, kind, true);
  hitEl.parentNode.insertBefore(el, hitEl);
  flowOverlays.push(el);
}

// "Highlight all lines" toggle: every visible line animates at once. Lighter than
// the hover highlight (no glow) so hovering a line still stands out on top of it.
// Paused while a column trace is shown, so the traced path stays the focus.
function renderFlowAll(){
  if(!highlightAll || traceState) return;
  edgesSvg.querySelectorAll('.ref-hit, .dep-hit').forEach(hit => {
    hit.parentNode.insertBefore(makeFlowEl(hit, hit.classList.contains('ref-hit') ? 'ref' : 'dep', false), hit);
  });
}
function setHighlightAll(on){
  highlightAll = on;
  const b = document.getElementById('flowAllBtn');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.classList.toggle('on', on);
  try{ localStorage.setItem('lineage-highlight-all', on ? '1' : '0'); }catch(_){}
  drawEdges();
}
function hideEdgeFlow(){
  flowOverlays.forEach(el => el.remove());
  flowOverlays = [];
}

// Card content for one table-level line. If every mapping between the two tables
// comes from a single Dep block, show that block as written (its note + SQL);
// otherwise merge the pieces (e.g. inline deps, or several blocks).
function pairBlock(list){
  const origs = list.map(e => e.orig);
  const blocks = [...new Set(origs.map(o => o.block))];
  if(blocks.length === 1 && blocks[0]) return blocks[0];
  const realBlocks = blocks.filter(Boolean);
  const notes = [...new Set(origs.map(o => o.note).filter(Boolean))];
  const sqls = [...new Set([...realBlocks.map(b => b.sql), ...origs.map(o => o.sql)].filter(Boolean))];
  return {
    name: realBlocks.map(b => b.name).filter(Boolean).join(' + ') || null,
    meta: Object.assign({}, ...realBlocks.map(b => b.meta || {})),
    fromTables: [...new Set(origs.map(o => o.fromT))],
    toTable: [...new Set(origs.map(o => o.toT))].join(', '),
    note: notes.join('\n\n') || null,
    sql: sqls.join('\n\n') || null,
    edges: origs,
  };
}

// Draw a flowing overlay for any path (used for column-level lines, which
// aren't in the diagram until a column is hovered).
function addFlowPath(d, kind, color){
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  el.setAttribute('d', d);
  el.setAttribute('class', 'edge-flow ' + (kind === 'ref' ? 'ref-flow' : 'dep-flow'));
  if(color){ el.style.stroke = color; el.style.filter = `drop-shadow(0 0 3px ${color})`; }
  edgesSvg.appendChild(el);
  flowOverlays.push(el);
}

// Hovering a column reveals its column-level lineage, one hop each way: every Dep
// coming into it (incl. a whole-table Dep into its table) and every one leaving it.
function highlightColumnLines(table, field){
  hideEdgeFlow();
  if(mode === 'ref') return;
  currentDisplay.edges.forEach(e => {
    if(e.kind !== 'dep') return;
    const o = e.orig;
    const upstream = o.toT === table && (o.toF === field || !o.toF);
    const downstream = o.fromT === table && o.fromF === field;
    if(!upstream && !downstream) return;
    const d = edgePath(e.fromId, e.fromField, e.toId, e.toField);
    if(d) addFlowPath(d, 'dep', edgeColor(e));
  });
}

// ---------- Dep line hover tooltip (source/target, note, embedded SQL, column list) ----------
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const depTooltipEl = document.getElementById('depTooltip');
let depTooltipHideTimer = null;

function depTooltipHTML(block){
  let html = `<div class="dt-head">
    ${block.name ? `<div class="dt-colhead"><span class="dt-colname">${esc(block.name)}</span></div>` : ''}
    <div class="dt-from">${esc(block.fromTables.join(', '))}</div>
    <div class="dt-arrow">↳ ${esc(block.toTable)}</div>
  </div>`;
  if(block.note){
    html += `<div class="dt-section"><div class="dt-label">Note</div><div class="dt-note">${esc(block.note)}</div></div>`;
  }
  // named Dep blocks carry settings like materialized / owner / any custom key
  const meta = Object.entries(block.meta || {});
  if(meta.length){
    html += `<div class="dt-section"><div class="dt-label">Metadata</div><ul class="dt-cols">${meta.map(([k, v]) => `<li>${esc(k)}: <b>${esc(v)}</b></li>`).join('')}</ul></div>`;
  }
  if(block.sql){
    html += `<div class="dt-section"><div class="dt-label">SQL</div><div class="dt-sql">${esc(block.sql)}</div></div>`;
  }
  const colEdges = block.edges.filter(e => e.fromF && e.toF);
  if(colEdges.length){
    html += `<div class="dt-section"><div class="dt-label">Column-level</div><ul class="dt-cols">`;
    colEdges.forEach(e => { html += `<li>${esc(e.fromT+'.'+e.fromF)} → ${esc(e.toT+'.'+e.toF)}</li>`; });
    html += `</ul></div>`;
  }
  return html;
}

function showDepTooltip(block, ev){ showCard(depTooltipHTML(block), ev); }
function showCard(html, ev){
  clearTimeout(depTooltipHideTimer);
  depTooltipEl.innerHTML = html;
  depTooltipEl.classList.add('show');
  positionDepTooltip(ev);
}
function hideCardNow(){ clearTimeout(depTooltipHideTimer); depTooltipEl.classList.remove('show'); }

const CARD_WORD = { one:'one', many:'many' };
function relText(myCard, myOpt, otherCard, otherOpt){
  const w = (c, o) => (o ? 'zero-or-' : '') + CARD_WORD[c];
  return `${w(myCard, myOpt)}-to-${w(otherCard, otherOpt)}`;
}

// Column card: name + type, constraints, note, and where the column sits in the lineage.
function columnTooltipHTML(tableName, fieldName){
  const t = model.tables.get(tableName);
  const f = t && t.fields.find(x => x.name === fieldName);
  if(!f) return '';
  let html = `<div class="dt-head">
    <div class="dt-colhead"><span class="dt-colname">${esc(f.name)}</span><span class="dt-coltype">${esc(f.type)}</span></div>
    <div class="dt-sub">${esc(tableName)}</div>`;
  const badges = [];
  if(f.pk) badges.push('PK');
  if(f.notNull) badges.push('NOT NULL');
  if(f.unique) badges.push('UNIQUE');
  if(f.increment) badges.push('INCREMENT');
  if(f.dflt) badges.push('DEFAULT ' + f.dflt);
  Object.entries(f.props || {}).forEach(([k, v]) => badges.push(v === true ? k.toUpperCase() : `${k}: ${v}`));
  if(badges.length) html += `<div class="dt-badges">${badges.map(b => `<span class="dt-badge">${esc(b)}</span>`).join('')}</div>`;
  html += `</div>`;

  if(f.note) html += `<div class="dt-section"><div class="dt-label">Note</div><div class="dt-note">${esc(f.note)}</div></div>`;
  if(f.check) html += `<div class="dt-section"><div class="dt-label">Check</div><div class="dt-sql">${esc(f.check)}</div></div>`;
  // column typed with an enum: list its allowed values
  const en = model.enums && (model.enums.get(canon(f.type)) || model.enums.get(t.schema + '.' + f.type));
  if(en) html += `<div class="dt-section"><div class="dt-label">Enum values</div><ul class="dt-cols">${en.map(v => `<li>${esc(v.value)}${v.note ? ` <span class="dt-dim">— ${esc(v.note)}</span>` : ''}</li>`).join('')}</ul></div>`;

  const from = model.deps.filter(d => d.toT === tableName && (d.toF === fieldName || !d.toF))
    .map(d => d.fromF ? `${d.fromT}.${d.fromF}` : `${d.fromT} (whole table)`);
  const into = model.deps.filter(d => d.fromT === tableName && d.fromF === fieldName).map(d => `${d.toT}.${d.toF}`);
  if(from.length) html += `<div class="dt-section"><div class="dt-label">Built from</div><ul class="dt-cols">${[...new Set(from)].map(s => `<li>← ${esc(s)}</li>`).join('')}</ul></div>`;
  if(into.length) html += `<div class="dt-section"><div class="dt-label">Feeds</div><ul class="dt-cols">${[...new Set(into)].map(s => `<li>→ ${esc(s)}</li>`).join('')}</ul></div>`;

  const rels = [];
  const relExtra = r => [r.name && `fk ${r.name}`, r.onDelete && `on delete ${r.onDelete}`, r.onUpdate && `on update ${r.onUpdate}`, r.inactive && 'inactive', r.composite && 'composite key']
    .filter(Boolean).map(s => ', ' + s).join('');
  model.refs.forEach(r => {
    if(r.fromT === tableName && r.fromF === fieldName) rels.push(`${r.toT}.${r.toF}  (${relText(r.fromCard, r.fromOpt, r.toCard, r.toOpt)}${relExtra(r)})`);
    if(r.toT === tableName && r.toF === fieldName) rels.push(`${r.fromT}.${r.fromF}  (${relText(r.toCard, r.toOpt, r.fromCard, r.fromOpt)}${relExtra(r)})`);
  });
  if(rels.length) html += `<div class="dt-section"><div class="dt-label">Relationships</div><ul class="dt-cols">${rels.map(s => `<li>⇄ ${esc(s)}</li>`).join('')}</ul></div>`;
  return html;
}

function tableTooltipHTML(tableName){
  const t = model.tables.get(tableName);
  if(!t) return '';
  const badges = [];
  if(t.alias) badges.push('alias ' + t.alias);
  t.partials.forEach(p => badges.push('~' + p));
  if(t.records) badges.push(`${t.records} sample row${t.records > 1 ? 's' : ''}`);
  Object.entries(t.props || {}).forEach(([k, v]) => badges.push(v === true ? k : `${k}: ${v}`));
  let html = `<div class="dt-head">
    <div class="dt-colhead"><span class="dt-colname">${esc(t.name)}</span></div>
    <div class="dt-sub">schema ${esc(t.schema)} · group ${esc(t.group)} · ${t.fields.length} columns</div>
    ${badges.length ? `<div class="dt-badges">${badges.map(b => `<span class="dt-badge">${esc(b)}</span>`).join('')}</div>` : ''}
  </div>`;
  if(t.note) html += `<div class="dt-section"><div class="dt-label">Note</div><div class="dt-note">${esc(t.note)}</div></div>`;
  if(t.indexes.length) html += `<div class="dt-section"><div class="dt-label">Indexes</div><ul class="dt-cols">${t.indexes.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`;
  if(t.checks.length) html += `<div class="dt-section"><div class="dt-label">Checks</div><ul class="dt-cols">${t.checks.map(c => `<li>${esc(c.expr)}${c.name ? ` <span class="dt-dim">(${esc(c.name)})</span>` : ''}</li>`).join('')}</ul></div>`;
  return html;
}

function bindHoverCards(){
  nodesEl.querySelectorAll('.row[data-field]').forEach(r => {
    r.addEventListener('mouseenter', ev => {
      const h = columnTooltipHTML(r.dataset.table, r.dataset.field);
      if(h) showCard(h, ev);
      highlightColumnLines(r.dataset.table, r.dataset.field);
    });
    r.addEventListener('mousemove', positionDepTooltip);
    r.addEventListener('mouseleave', () => { hideDepTooltipSoon(); hideEdgeFlow(); });
  });
  nodesEl.querySelectorAll('.head[data-table]').forEach(h => {
    h.addEventListener('mouseenter', ev => showCard(tableTooltipHTML(h.dataset.table), ev));
    h.addEventListener('mousemove', positionDepTooltip);
    h.addEventListener('mouseleave', hideDepTooltipSoon);
    h.addEventListener('mousedown', hideCardNow); // grabbing the header to drag — get the card out of the way
  });
}
// window coordinates (the card is position:fixed), flipped to stay fully on screen
function positionDepTooltip(ev){
  const w = depTooltipEl.offsetWidth || 340, h = depTooltipEl.offsetHeight || 120;
  let left = ev.clientX + 16, top = ev.clientY + 12;
  if(left + w > window.innerWidth - 8) left = ev.clientX - w - 16;
  if(top + h > window.innerHeight - 8) top = Math.max(8, window.innerHeight - h - 8);
  depTooltipEl.style.left = Math.max(8, left) + 'px';
  depTooltipEl.style.top = Math.max(8, top) + 'px';
}
function hideDepTooltipSoon(){
  depTooltipHideTimer = setTimeout(() => depTooltipEl.classList.remove('show'), 120);
}

function renderLegend(){
  const groups = new Set();
  model.tables.forEach(t => groups.add(t.group));
  let html = '';
  groups.forEach(g => {
    html += `<div class="item"><span class="swatch" data-swatch-key="${g}" style="background:${groupColor(g)}"></span>${g}</div>`;
  });
  html += `<div class="item"><span class="edge-sample" style="border-top:2.5px dashed var(--text-dim)"></span>lineage (Dep, curved)</div>`;
  html += `<div class="item"><span class="edge-sample" style="background:var(--text-dim)"></span>relationship (Ref, right-angled)</div>`;
  legendEl.innerHTML = html;
}

// ---------- Right panel: tables tree (per-group + per-table visibility, like dbdiagram's search panel) ----------
const treeList = document.getElementById('treeList');
const groupBySelect = document.getElementById('groupBySelect');
groupBySelect.addEventListener('change', () => {
  treeGroupBy = groupBySelect.value;
  renderTree();
  persistState();
});

function renderTree(){
  const byGroup = treeGroupBy === 'group';
  const hiddenSet = byGroup ? hiddenGroups : hiddenSchemas;
  const keyOf = t => byGroup ? t.group : t.schema;

  const buckets = new Map();
  model.tables.forEach((t, name) => {
    const key = keyOf(t);
    if(!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(name);
  });
  const q = (document.getElementById('search').value || '').trim().toLowerCase();

  let html = '';
  let any = false;
  buckets.forEach((tableNames, key) => {
    const keyTextMatch = !q || key.toLowerCase().includes(q);
    const matchingTables = tableNames.filter(n => n.toLowerCase().includes(q));
    if(q && !keyTextMatch && matchingTables.length === 0) return;
    any = true;

    const bucketHidden = hiddenSet.has(key);
    const visibleCount = tableNames.filter(n => !hiddenTables.has(n) && !bucketHidden).length;
    const total = tableNames.length;
    const collapsedInTree = treeCollapsed.has(byGroup?'g:'+key:'s:'+key);
    const collapsedInDiagram = byGroup && collapsedGroups.has(key);
    const swatch = byGroup
      ? `<input type="color" class="tree-color" data-key="${key}" value="${toHex(groupColor(key))}" title="pick a color for this group">`
      : `<span class="tree-swatch schema-swatch"></span>`;

    html += `<div class="tree-group">
      <div class="tree-group-head">
        <button class="tree-chevron" data-key="${key}">${collapsedInTree?'▸':'▾'}</button>
        ${swatch}
        <span class="tree-gname" title="${byGroup && model.groupNotes && model.groupNotes[key] ? model.groupNotes[key] : key}">${key}</span>
        <span class="tree-badge">${visibleCount}/${total}</span>
        ${byGroup ? `<button class="tree-merge" data-key="${key}" title="${collapsedInDiagram?'split back into separate tables on canvas':'merge this group into one summary node on canvas'}">${collapsedInDiagram?'split':'merge'}</button>` : ''}
        <button class="tree-eye" data-scope="bucket" data-key="${key}" title="show/hide everything in this ${byGroup?'group':'schema'}">${bucketHidden?'🙈':'👁'}</button>
      </div>`;
    if(!collapsedInTree){
      (q ? matchingTables : tableNames).forEach(n => {
        const hidden = hiddenTables.has(n) || bucketHidden;
        html += `<div class="tree-row ${hidden?'off':''}">
          <span class="tree-tname" title="${n}">${n}</span>
          <button class="tree-eye" data-scope="table" data-table="${n}" title="show/hide this table">${hidden?'🙈':'👁'}</button>
        </div>`;
      });
    }
    html += `</div>`;
  });
  treeList.innerHTML = any ? html : `<div class="tree-empty">no table matches "${q}"</div>`;

  treeList.querySelectorAll('.tree-chevron').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = (byGroup?'g:':'s:')+btn.dataset.key;
      treeCollapsed.has(k) ? treeCollapsed.delete(k) : treeCollapsed.add(k);
      renderTree();
    });
  });
  treeList.querySelectorAll('.tree-merge').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      collapsedGroups.has(key) ? collapsedGroups.delete(key) : collapsedGroups.add(key);
      render(); persistState();
    });
  });
  treeList.querySelectorAll('.tree-eye').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.dataset.scope === 'bucket'){
        const key = btn.dataset.key;
        hiddenSet.has(key) ? hiddenSet.delete(key) : hiddenSet.add(key);
      } else {
        const n = btn.dataset.table;
        hiddenTables.has(n) ? hiddenTables.delete(n) : hiddenTables.add(n);
      }
      traceState = null; tracebar.classList.remove('show');
      render(); persistState();
    });
  });
  treeList.querySelectorAll('.tree-color').forEach(inp => {
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('input', () => applyGroupColorLive(inp.dataset.key, inp.value));
    inp.addEventListener('change', () => {
      groupColorOverrides[inp.dataset.key] = inp.value;
      render(); persistState();
    });
  });
}

function bindExpandButtons(){

// ---------- Draggable nodes ----------
function makeDraggable(el, id){
  el.addEventListener('mousedown', (e) => {
    if(e.target.closest('.row') || e.target.closest('.expand-btn')) return;
    e.preventDefault();
    e.stopPropagation();
    const pos = positions[id];
    const startX = e.clientX, startY = e.clientY;
    const origX = pos.x, origY = pos.y;
    el.style.zIndex = 5;

    function onMove(ev){
      const dx = (ev.clientX - startX) / scale;
      const dy = (ev.clientY - startY) / scale;
      pos.x = origX + dx;
      pos.y = origY + dy;
      el.style.left = pos.x + 'px';
      el.style.top = pos.y + 'px';
      manualPos[id] = { x: pos.x, y: pos.y };
      drawEdges();
      renderGroupBoxes();
    }
    function onUp(){
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      el.style.zIndex = '';
      persistState();
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}

// BFS both directions along Dep edges from a start field
function traceColumn(table, field){
  const startKey = table+'.'+field;
  const tableSet = new Set([table]);
  const fieldSet = new Set([startKey]);
  const hitEdges = [];
  const steps = [];

  function connects(e, key, tbl){
    if(e.fromF && e.toF){
      const fk = e.fromT+'.'+e.fromF, tk = e.toT+'.'+e.toF;
      if(fk === key) return { next:tk, note:e.note, label:`${e.fromT}.${e.fromF} → ${e.toT}.${e.toF}` };
      if(tk === key) return { next:fk, note:e.note, label:`${e.fromT}.${e.fromF} → ${e.toT}.${e.toF}` };
    } else {
      if(e.fromT === tbl) return { next:e.toT+'.*', note:e.note, label:`${e.fromT} → ${e.toT} (table)` };
      if(e.toT === tbl) return { next:e.fromT+'.*', note:e.note, label:`${e.fromT} → ${e.toT} (table)` };
    }
    return null;
  }

  const queue = [startKey];
  const seenEdges = new Set();
  while(queue.length){
    const key = queue.shift();
    const tbl = key.split('.')[0];
    model.deps.forEach((e,i) => {
      const c = connects(e, key, tbl);
      if(c && !seenEdges.has(i)){
        seenEdges.add(i);
        hitEdges.push(e);
        const nextTbl = c.next.split('.')[0];
        tableSet.add(nextTbl);
        if(!c.next.endsWith('.*')) fieldSet.add(c.next);
        steps.push(c.label + (c.note ? `  — ${c.note}` : ''));
        queue.push(c.next);
      }
    });
  }

  const displayIdSet = new Set();
  tableSet.forEach(t => { const id = currentDisplay.idOf(t); if(id) displayIdSet.add(id); });

  traceState = { tableSet, fieldSet, edgeSet: new Set(hitEdges), displayIdSet };
  drawEdges();
  tracebar.classList.add('show');
  tracepath.innerHTML = steps.length
    ? [...new Set(steps)].map(s=>`• ${s}`).join('<br>')
    : '(no upstream/downstream Dep edges found for this field)';
}

document.getElementById('traceClose').addEventListener('click', () => {
  traceState = null;
  tracebar.classList.remove('show');
  drawEdges();
});

// ---------- Zoom / pan ----------
let panX=60, panY=30;
function applyTransform(){
  viewport.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById('zoomlabel').textContent = Math.round(scale*100)+'%';
}
document.getElementById('zoomin').addEventListener('click', ()=>{ scale=Math.min(2,scale+0.1); applyTransform(); });
document.getElementById('zoomout').addEventListener('click', ()=>{ scale=Math.max(0.2,scale-0.1); applyTransform(); });
document.getElementById('zoomfit').addEventListener('click', ()=>{ scale=1; panX=60; panY=30; applyTransform(); });
document.getElementById('flowAllBtn').addEventListener('click', () => setHighlightAll(!highlightAll));
// H toggles "highlight all lines" — but never while typing in the editor or a field
document.addEventListener('keydown', e => {
  if(e.key !== 'h' && e.key !== 'H') return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  e.preventDefault();
  setHighlightAll(!highlightAll);
});

const canvasPane = document.getElementById('canvasPane');
let dragging=false, lastX=0, lastY=0;
canvasPane.addEventListener('mousedown', e => { if(e.target.closest('.node')) return; dragging=true; lastX=e.clientX; lastY=e.clientY; canvasPane.style.cursor='grabbing'; });
window.addEventListener('mousemove', e => { if(!dragging) return; panX += e.clientX-lastX; panY += e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; applyTransform(); });
window.addEventListener('mouseup', () => { dragging=false; canvasPane.style.cursor='default'; });
canvasPane.addEventListener('wheel', e => {
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.05 : 0.05;
  scale = Math.min(2, Math.max(0.2, scale+delta));
  applyTransform();
}, { passive:false });

// ---------- Detail level menu (All / Keys) ----------
const detailChip = document.getElementById('detailChip');
const detailMenu = document.getElementById('detailMenu');
const DETAIL_ICONS = { keys: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="5" cy="11" r="3.2"/><path d="M7.3 8.7 14 2M11 5l2 2M12.5 3.5l1.5 1.5"/></svg>', all: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M6 2.5v11M1.5 6h13"/></svg>' };
function setDetail(level, persist = true){
  detailLevel = level === 'keys' ? 'keys' : 'all';
  document.getElementById('detailIcon').innerHTML = DETAIL_ICONS[detailLevel];
  document.getElementById('detailLabel').textContent = detailLevel === 'keys' ? 'Keys' : 'All';
  detailMenu.querySelectorAll('.dm-item').forEach(b => b.setAttribute('aria-checked', b.dataset.level === detailLevel ? 'true' : 'false'));
  if(persist){ try{ localStorage.setItem('lineage-detail', detailLevel); }catch(_){} render(); }
}
function closeDetailMenu(focusChip){ detailMenu.hidden = true; detailChip.setAttribute('aria-expanded', 'false'); if(focusChip) detailChip.focus(); }
detailChip.addEventListener('click', e => {
  e.stopPropagation();
  if(!detailMenu.hidden){ closeDetailMenu(); return; }
  detailMenu.hidden = false; detailChip.setAttribute('aria-expanded', 'true');
  (detailMenu.querySelector('.dm-item[aria-checked="true"]') || detailMenu.querySelector('.dm-item')).focus();
});
detailMenu.addEventListener('click', e => e.stopPropagation());
detailMenu.querySelectorAll('.dm-item').forEach(b => b.addEventListener('click', () => { setDetail(b.dataset.level); closeDetailMenu(true); }));
detailMenu.addEventListener('keydown', e => {
  const items = [...detailMenu.querySelectorAll('.dm-item')];
  const i = items.indexOf(document.activeElement);
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus(); }
  if(e.key === 'Escape'){ e.preventDefault(); closeDetailMenu(true); }
});
document.addEventListener('click', () => { if(!detailMenu.hidden) closeDetailMenu(); });

// ---------- mode chips ----------
document.querySelectorAll('.chip[data-mode]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-mode]').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');

const editorPane = document.getElementById('editorPane');
const paneToggle = document.getElementById('paneToggle');
function setEditorCollapsed(collapsed){
  editorPane.classList.toggle('collapsed', collapsed);
  paneToggle.textContent = collapsed ? '›' : '‹';

// ---------- Views (tailored perspectives) ----------
const viewsChip = document.getElementById('viewsChip');
const viewsPanel = document.getElementById('viewsPanel');
viewsChip.addEventListener('click', (e) => { e.stopPropagation(); viewsPanel.classList.toggle('show'); renderViewsPanel(); });
viewsPanel.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => viewsPanel.classList.remove('show'));

function loadViews(){ try{ return JSON.parse(localStorage.getItem('lineage-views')||'{}'); }catch(_){ return {}; } }
function saveViewsToStorage(v){ try{ localStorage.setItem('lineage-views', JSON.stringify(v)); }catch(_){} }

function renderViewsPanel(){
  const views = loadViews();
  let html = `<div class="vp-row"><input id="viewNameInput" placeholder="name this view…"><button id="viewSaveBtn">Save</button></div>`;
  html += `<div class="vp-list">`;
  const names = Object.keys(views);
  if(names.length === 0) html += `<div class="vp-empty">no saved views yet — hide/collapse some groups, then save</div>`;
  names.forEach(name => {
    html += `<div class="vp-item"><span class="vp-apply" data-name="${name}">${name}</span><button class="vp-del" data-name="${name}" title="delete">✕</button></div>`;
  });
  html += `</div><div class="vp-row"><button id="viewResetBtn" style="flex:1">Reset — show &amp; expand all</button></div>`;
  viewsPanel.innerHTML = html;

  document.getElementById('viewSaveBtn').addEventListener('click', () => {
    const input = document.getElementById('viewNameInput');
    const name = input.value.trim();
    if(!name) return;
    const vs = loadViews();
    vs[name] = { hidden: [...hiddenGroups], hiddenSchemas: [...hiddenSchemas], collapsed: [...collapsedGroups], groupBy: treeGroupBy, detail: detailLevel };
    saveViewsToStorage(vs);
    renderViewsPanel();
  });
  document.getElementById('viewResetBtn').addEventListener('click', () => {
    hiddenGroups = new Set(); hiddenSchemas = new Set(); collapsedGroups = new Set();
    render(); persistState(); renderViewsPanel();
  });
  viewsPanel.querySelectorAll('.vp-apply').forEach(el => {
    el.addEventListener('click', () => {
      const vs = loadViews();
      const v = vs[el.dataset.name];
      if(!v) return;
      hiddenGroups = new Set(v.hidden);
      hiddenSchemas = new Set(v.hiddenSchemas || []);
      collapsedGroups = new Set(v.collapsed);
      treeGroupBy = v.groupBy === 'schema' ? 'schema' : 'group';
      groupBySelect.value = treeGroupBy;
      if(v.detail){ setDetail(v.detail, false); try{ localStorage.setItem('lineage-detail', detailLevel); }catch(_){} }
      traceState = null; tracebar.classList.remove('show');
      render(); persistState();
    });
  });
  viewsPanel.querySelectorAll('.vp-del').forEach(el => {
    el.addEventListener('click', () => {
      const vs = loadViews();
      delete vs[el.dataset.name];
      saveViewsToStorage(vs);
      renderViewsPanel();
    });
  });
}

// ---------- parse + rebuild pipeline ----------
const srcEl = document.getElementById('src');
let debounceTimer;
function persistState(){
  try{
    localStorage.setItem('lineage-src', srcEl.value);
    localStorage.setItem('lineage-ui', JSON.stringify({ hidden:[...hiddenGroups], hiddenSchemas:[...hiddenSchemas], hiddenTables:[...hiddenTables], collapsed:[...collapsedGroups], groupBy:treeGroupBy, groupColors:groupColorOverrides, manualPos }));
  }catch(_){}
}
function rebuild(){
  try{
    model = parseSchema(srcEl.value);
    { const kc = computeKeyCols(model); model.keyCols = kc.keys; model.pkCols = kc.pks; }
    traceState = null;
    tracebar.classList.remove('show');
    render();
    if(model.errors.length){
      statusEl.textContent = `warning${model.errors.length > 1 ? ' (' + model.errors.length + ')' : ''}: ` + model.errors[0];
      statusEl.title = model.errors.join('\n');
      statusEl.classList.add('err');
    } else {
      const pj = model.project ? `${model.project.name || 'project'}${model.project.databaseType ? ' (' + model.project.databaseType + ')' : ''} · ` : '';
      statusEl.textContent = `parsed ✓  ${pj}${model.tables.size} tables, ${model.refs.length} refs, ${model.deps.length} deps`;
      statusEl.title = statusEl.textContent;
      statusEl.classList.remove('err');
    }
    persistState();
    reportDirty();
  }catch(err){
    statusEl.textContent = 'parse error: ' + err.message;
    statusEl.classList.add('err');
  }
}
srcEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(rebuild, 220);
});

document.querySelectorAll('.examples-row button').forEach(btn => {
  btn.addEventListener('click', () => {
    srcEl.value = btn.dataset.ex === 'pipeline' ? PIPELINE_EXAMPLE : MINIMAL_EXAMPLE;
    manualPos = {}; hiddenGroups = new Set(); hiddenTables = new Set(); collapsedGroups = new Set(); groupColorOverrides = {};
    rebuild();
  });
});

// ---------- boot ----------
let initialSrc = PIPELINE_EXAMPLE;
try{
  const savedSrc = localStorage.getItem('lineage-src');
  if(savedSrc) initialSrc = savedSrc;
  const savedUi = JSON.parse(localStorage.getItem('lineage-ui') || 'null');
  if(savedUi){
    hiddenGroups = new Set(savedUi.hidden || []);
    hiddenSchemas = new Set(savedUi.hiddenSchemas || []);
    hiddenTables = new Set(savedUi.hiddenTables || []);
    collapsedGroups = new Set(savedUi.collapsed || []);
    treeGroupBy = savedUi.groupBy === 'schema' ? 'schema' : 'group';    groupColorOverrides = savedUi.groupColors || {};
    manualPos = savedUi.manualPos || {};
  }
}catch(_){}
groupBySelect.value = treeGroupBy;
srcEl.value = initialSrc;
try{ if(localStorage.getItem('lineage-editor-collapsed') === '1') setEditorCollapsed(true); }catch(_){}
try{ if(localStorage.getItem('lineage-tree-collapsed') === '1') setTreeCollapsed2(true); }catch(_){}
try{ const dl = localStorage.getItem('lineage-detail'); if(dl) setDetail(dl, false); }catch(_){}
try{ if(localStorage.getItem('lineage-highlight-all') === '1'){ highlightAll = true; const fb = document.getElementById('flowAllBtn'); fb.classList.add('on'); fb.setAttribute('aria-pressed', 'true'); } }catch(_){}
// ---------- Native Mac app bridge (inactive in a browser) ----------
// The Mac app loads/saves .dbml files through window.SLS and shows the
// "unsaved changes" dot from the 'dirty' messages below.
const nativeApp = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sls;
let savedText = srcEl.value;
function reportDirty(){
  if(nativeApp) nativeApp.postMessage({ type: 'dirty', dirty: srcEl.value !== savedText });
}
window.SLS = {
  getSource: () => srcEl.value,
  // a newly opened file starts with a fresh layout (positions from another file don't apply)
  loadSource(text){
    srcEl.value = text;
    savedText = text;
    manualPos = {}; hiddenGroups = new Set(); hiddenSchemas = new Set(); hiddenTables = new Set(); collapsedGroups = new Set();
    scale = 1; panX = 60; panY = 30; applyTransform();
    rebuild();
  },
  markSaved(){ savedText = srcEl.value; reportDirty(); },
};

rebuild();
applyTransform();
if(nativeApp){ document.documentElement.classList.add('in-mac-app'); nativeApp.postMessage({ type: 'ready' }); }

})();
</script>
